[project]
name = "service-assist-agent"
version = "0.1.0"
description = "Customer service agent assist (OpenAI Agents SDK) on Databricks Agent Runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks[openai]>=0.3.0",
    "databricks-openai>=0.10",
    "openai-agents>=0.6",
    "mlflow>=3.10.1",
    "databricks-sdk>=0.124.0",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assist", "runtime"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
start-server = "runtime.main:main"
